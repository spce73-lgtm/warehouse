<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>اسکنر انبارگردانی</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="اسکنر انبار">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- >>> افزوده شد: استایل فقط برای کلاس‌های کاملاً جدیدِ نوار پایین ناوبری (bottom-nav/bn-item)
     — چون style.css را نمی‌بینیم، این کلاس‌های تازه اینجا تعریف شده‌اند تا هیچ تداخلی با
     قوانین موجود در آن فایل رخ ندهد. padding-bottom روی .screen هم فقط برای اینکه محتوا زیر
     نوار ثابت پنهان نشود اضافه شده؛ چیزی از چیدمان قبلی حذف/بازنویسی نشده است. -->
<style>
  .screen{padding-bottom:64px;}
  .bottom-nav{position:fixed;bottom:0;inset-inline-start:0;inset-inline-end:0;height:58px;background:#fff;border-top:1px solid #eceef1;display:flex;align-items:stretch;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:#8b94a0;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;padding:6px 4px;}
  .bn-item:active{background:#f7f8fa;}
  .bn-item.active{color:#0f4c81;}
</style>
<!-- <<< پایان بخش افزوده‌شده -->
</head>
<body>

<!-- ============ صفحه‌ی ورود ============ -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    </div>
    <div class="login-title">اسکنر انبارگردانی</div>
    <div class="login-sub">ورود با همان نام کاربری سامانه انبار</div>
    <div id="loginMsg"></div>

    <div class="field">
      <label>نام کاربری</label>
      <input type="text" id="loginUsername" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">ورود</button>
  </div>
</div>

<!-- ============ صفحه‌ی اصلی (جست‌وجو + نتایج + جزئیات) ============ -->
<div class="screen" id="mainScreen">
  <div class="top-strip" style="background:#0f4c81;color:#fff;">
    <button class="icon-btn" onclick="doLogout()" title="خروج" style="color:#fff;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
    <div class="who" style="color:#fff;"><span id="whoLabel">—</span><span id="whoSub" style="color:#cfe0f0;"></span></div>
    <!-- >>> افزوده شد: دکمه‌ی همگام‌سازی داخل نوار آبی بالا (طبق درخواست) — محتوای کامل توسط
         renderSyncBar() در app.js پر می‌شود؛ فقط جای این عنصر عوض شده، منطق دست‌نخورده است. -->
    <div id="syncBar"></div>
    <!-- <<< پایان بخش افزوده‌شده -->
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="کد یا نام کالا را وارد کنید..." inputmode="search">
    <button class="icon-btn accent" onclick="doSearch()" title="جست‌وجو">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </button>
  </div>

  <div id="resultArea">
    <div class="section-title">آخرین موارد ثبت‌شده در این جلسه</div>
    <div id="recentList"><div class="empty-hint">دوربین گوشی را روی کیوآرکد کالا بگیرید، یا کد/نام را اینجا تایپ کنید.</div></div>
  </div>
</div>

<!-- ============ صفحه‌ی پیش‌نمایش عمومی کالا (قبل از ورود) ============ -->
<div class="screen" id="publicItemScreen">
  <div class="top-strip">
    <button class="icon-btn" onclick="showScreen('loginScreen')" title="ورود">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>
    <div class="who"><span>اسکنر انبارگردانی</span><span>پیش‌نمایش کالا</span></div>
    <div style="width:36px;"></div>
  </div>
  <div id="publicItemArea" style="padding:14px;overflow-y:auto;flex:1;"></div>
</div>

<!-- ============ صفحه‌ی «قفسه‌ها» — نظارت خودکار بار قفسه (فقط دسترسی انبار) ============ -->
<div class="screen" id="shelvesScreen">
  <div class="top-strip">
    <button class="icon-btn" onclick="shelvesBack()" title="بازگشت">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>
    <div class="who"><span>قفسه‌ها</span><span>نظارت بار قفسه</span></div>
    <div style="width:36px;"></div>
  </div>
  <div id="shelvesArea" style="padding:14px;overflow-y:auto;flex:1;"></div>
</div>

<!-- >>> افزوده شد: نوار پایینِ ناوبری (خانه | جستجو | لیست قفسه‌ها) — بیرون از تگ‌های .screen تا
     در تمام صفحات ثابت بماند؛ نمایش/پنهانی آن با enterApp()/doLogout() در app.js کنترل می‌شود
     (دقیقاً همان الگوی نمایش/پنهانیِ shelvesNavBtn قبلی). «لیست قفسه‌ها» فقط برای کاربران دارای
     دسترسی انبار نشان داده می‌شود (id="bottomNavShelves")، همان‌طور که قبلاً هم همین‌طور بود. -->
<div class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="bn-item" onclick="navGoHome_()" title="خانه">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    <span>خانه</span>
  </button>
  <button class="bn-item" onclick="navGoSearch_()" title="جستجو">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <span>جستجو</span>
  </button>
  <button class="bn-item" id="bottomNavShelves" onclick="openShelvesList()" title="لیست قفسه‌ها" style="display:none;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    <span>لیست قفسه‌ها</span>
  </button>
</div>
<!-- <<< پایان بخش افزوده‌شده -->

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
