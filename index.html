<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>اسکنر انبارگردانی</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f4c81">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="اسکنر انبار">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ صفحه‌ی ورود ============ -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
    </div>
    <div class="login-title">اسکنر انبارگردانی</div>
    <div class="login-sub">ورود با همان نام کاربری سامانه انبار</div>
    <div id="loginMsg"></div>

    <div class="server-field">
      <label style="display:block;font-size:12.5px;font-weight:700;color:#5a6472;margin-bottom:6px;">آدرس سامانه (فقط بار اول)</label>
      <input type="text" id="serverUrlInput" placeholder="https://script.google.com/macros/s/XXXXX/exec" autocomplete="off">
      <small>این آدرس همان لینک وب‌اپ گوگل‌شیت شماست؛ یک‌بار وارد کنید، ذخیره می‌شود.</small>
    </div>

    <div class="field">
      <label>نام کاربری</label>
      <input type="text" id="loginUsername" autocomplete="username">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">ورود</button>
  </div>
</div>

<!-- ============ صفحه‌ی اصلی (جست‌وجو + نتایج + جزئیات) ============ -->
<div class="screen" id="mainScreen">

  <!-- >>> بازطراحی شد: هدر تیره‌ی بالای صفحه — دکمه‌ی «همگام‌سازی» (+ آخرین زمان) سمت چپ بصری،
       عنوان صفحه در وسط، اطلاعات کاربر + خروج سمت راست بصری. تمام آی‌دی‌های موردنیازِ app.js
       (whoLabel/whoSub) دقیقاً حفظ شده‌اند تا enterApp() بدون تغییر کار کند. -->
  <div class="app-header">
    <button class="header-sync-btn" id="headerSyncBtn" onclick="syncNow(true)" title="همگام‌سازی">
      <span class="header-sync-dot" id="headerSyncDot"></span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span class="header-sync-text"><b>همگام‌سازی</b><small id="headerLastSync">آخرین همگام‌سازی: —</small></span>
    </button>
    <div class="header-title" id="headerTitleMain">اسکنر انبارگردانی</div>
    <button class="header-user" onclick="doLogout()" title="خروج">
      <span class="header-user-info"><span class="header-user-name" id="whoLabel">—</span><span class="header-user-sub" id="whoSub"></span></span>
      <span class="header-user-avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    </button>
  </div>
  <!-- <<< پایان بخش بازطراحی‌شده -->

  <div class="search-row">
    <input type="text" id="searchInput" placeholder="کد یا نام کالا را وارد کنید..." inputmode="search">
    <button class="icon-btn accent" onclick="doSearch()" title="جست‌وجو">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    </button>
  </div>

  <div id="resultArea">
    <div class="section-title">آخرین موارد ثبت‌شده در این جلسه</div>
    <div id="recentList"><div class="empty-hint">دوربین گوشی را روی کیوآرکد کالا بگیرید، یا کد/نام را اینجا تایپ کنید.</div></div>
  </div>
</div>

<!-- ============ صفحه‌ی پیش‌نمایش عمومی کالا (قبل از ورود) ============ -->
<div class="screen" id="publicItemScreen">
  <div class="top-strip">
    <button class="icon-btn" onclick="showScreen('loginScreen')" title="ورود">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>
    <div class="who"><span>اسکنر انبارگردانی</span><span>پیش‌نمایش کالا</span></div>
    <div style="width:36px;"></div>
  </div>
  <div id="publicItemArea" style="padding:14px;overflow-y:auto;flex:1;"></div>
</div>

<!-- ============ صفحه‌ی «قفسه‌ها» — نظارت خودکار بار قفسه (فقط دسترسی انبار) ============ -->
<div class="screen" id="shelvesScreen">
  <!-- >>> بازطراحی شد: همان هدر تیره‌ی سراسری، با دکمه‌ی بازگشت به‌جای دکمه‌ی همگام‌سازی -->
  <div class="app-header">
    <button class="header-back-btn" onclick="shelvesBack()" title="بازگشت">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    </button>
    <div class="header-title" id="headerTitleShelves">لیست قفسه‌ها</div>
    <div style="width:36px;flex-shrink:0;"></div>
  </div>
  <!-- <<< پایان بخش بازطراحی‌شده -->
  <div id="shelvesArea" style="padding:14px;overflow-y:auto;flex:1;"></div>
</div>

<div class="toast" id="toast"></div>

<!-- >>> افزوده شد: ناوبری پایین سراسری — فقط وقتی کاربر وارد شده (mainScreen/shelvesScreen)
     نمایش داده می‌شود؛ نمایش/پنهان‌سازی و آی‌تم فعال توسط showScreen()/setActiveNav() در
     app.js مدیریت می‌شود. ترتیب DOM (راست به چپ در RTL): لیست قفسه‌ها، جستجو، همگام‌سازی، خانه —
     دقیقاً مطابق چیدمان خواسته‌شده (راست: لیست قفسه‌ها … چپ: خانه). -->
<nav class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="nav-item" id="navShelvesBtn" onclick="navGoShelves()" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
    <span>لیست قفسه‌ها</span>
  </button>
  <button class="nav-item" id="navSearchBtn" onclick="navGoSearch()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
    <span>جستجو</span>
  </button>
  <button class="nav-item" id="navSyncBtn" onclick="navGoSync()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    <span>همگام‌سازی</span>
    <small id="navLastSync"></small>
  </button>
  <button class="nav-item active" id="navHomeBtn" onclick="navGoHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>خانه</span>
  </button>
</nav>
<!-- <<< پایان بخش افزوده‌شده -->

<script src="app.js"></script>
</body>
</html>
